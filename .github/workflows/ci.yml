name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm ci
        working-directory: MonsterFrontend
      - name: Run tests
        run: npx vitest run --config MonsterFrontend/vite.test.config.ts
        working-directory: MonsterFrontend
